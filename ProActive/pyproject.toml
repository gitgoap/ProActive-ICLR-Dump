[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proactive"
version = "0.1.0"
description = "Active diagnostic measurement under a probe budget for MLLMs"
authors = [
    { name = "ProActive Project Team" }
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.3.0",
    "torchvision",
    # Model adapters enforce their narrower runtime contracts at load time.
    # InternVL3 custom code is pinned to 4.37.2; Qwen/Gemma use the server's
    # modern base runtime.
    "transformers>=4.37.2,<6",
    "accelerate>=0.30.0",
    "pillow",
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "tqdm",
    "pyyaml",
    "python-dotenv"
]

[project.optional-dependencies]
internvl = [
    "transformers==4.37.2",
    "accelerate==0.30.1",
    "tokenizers==0.15.1",
    "einops==0.6.1",
    "einops-exts==0.0.4",
    "timm==0.9.12",
    "sentencepiece==0.1.99",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["proactive*"]
